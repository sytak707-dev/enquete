<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>앙케이트 게임</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="/">앙케이트 <span>GAME</span></a><button id="adminOpen" class="ghost">관리자</button></header>
<main id="app"></main>
